[project]
name = "gee-tools"
version = "0.1.0"
description = "A portfolio of LLM-generated, aggressively tested Google Earth Engine tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "earthengine-api>=0.1.380",
    "geemap>=0.37.2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.1.14",
    "earthengine-api>=0.1.400",
    "geopandas>=0.14",
    "pandas>=2.0",
    "pre-commit"
]
 
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E: pycodestyle, F: pyflakes, I: isort
select = ["E", "F", "I"]

[tool.mypy]
files = ["src"]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[project.scripts]
gee-tool = "gee_tools.cli:main"

[[tool.mypy.overrides]]
module = "ee.*"
ignore_missing_imports = true

[tool.coverage.run]
relative_files = true
source = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/gee_tools"]

[tool.ruff.lint.isort]
known-first-party = ["gee_tools"]
