name: CI Pipeline

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  # PR comment with coverage diff — only meaningful on pull requests
  coverage-comment:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: coverage-data-${{ github.run_id }}

      - name: Post coverage comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # README badge — runs on every push to dev/main, writes a per-branch SVG
  # to the standalone `coverage-badges` branch (plain file storage, no
  # GitHub Pages involved).
  coverage-badge:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: coverage-data-${{ github.run_id }}

      - name: Generate badge SVG
        run: |
          pip install genbadge[coverage]
          genbadge coverage -i coverage.xml -o coverage.svg

      - name: Publish badge to coverage-badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin coverage-badges
          git worktree add /tmp/coverage-badges coverage-badges
          mkdir -p /tmp/coverage-badges/badges/${{ github.ref_name }}
          cp coverage.svg /tmp/coverage-badges/badges/${{ github.ref_name }}/coverage.svg
          cd /tmp/coverage-badges
          git add badges/${{ github.ref_name }}/coverage.svg
          git diff --cached --quiet || git commit -m "chore: update coverage badge for ${{ github.ref_name }}"
          git push origin coverage-badges
