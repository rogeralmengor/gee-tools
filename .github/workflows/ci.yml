name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install dependencies
        run: uv pip install --system -e .[dev]
        
      - name: Format & Lint with Ruff
        run: |
          ruff check .
          ruff format --check .
          
      - name: Type check with mypy
        run: mypy src/
        
      - name: Run tests
        # Note: GEE tests require authentication. You will eventually need to mock GEE 
        # or inject a service account key via GitHub Secrets for E2E tests.
        run: pytest tests/
