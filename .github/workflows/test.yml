name: Test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Format & Lint with Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check with mypy
        run: uv run mypy src/

      - name: Set up Earth Engine Credentials
        env:
          EE_CREDENTIALS_B64: ${{ secrets.EE_CREDENTIALS }}
        run: |
          mkdir -p ~/.config/earthengine
          echo "$EE_CREDENTIALS_B64" | base64 --decode > ~/.config/earthengine/credentials
          uv run python -c "
          import ee
          ee.Initialize(project='ee-thebeautyofthepixel')
          print('GEE Authentication Successful!')
          "

      - name: Run pytest with coverage
        run: uv run pytest tests/ --cov=src --cov-report=xml --cov-report=json

      # pytest-cov also writes .coverage (sqlite) automatically — needed by
      # python-coverage-comment-action's PR comment step.
      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ github.run_id }}
          path: |
            .coverage
            coverage.xml
            coverage.json
          include-hidden-files: true
